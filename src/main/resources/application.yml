spring:
  application:
    name: part-service
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  sql:
    init:
      # Schema is managed by scripts/sync_schema.py from the XML definitions.
      mode: never
server:
  port: ${SERVER_PORT:32010}
  forward-headers-strategy: framework
logging:
  file:
    name: /var/service/log/part-service/part-service.log
  level:
    root: INFO
