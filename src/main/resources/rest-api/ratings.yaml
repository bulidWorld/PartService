openapi: 3.0.3
info:
  title: Part Service API - Ratings
  version: 1.0.0
servers:
- url: /api/v1
tags:
- name: Ratings
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    userId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
        description: user ID字段
      description: user ID字段
  responses:
    RatingCategoriesResponse:
      description: Rating category codes
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponseRatingCategories'
    RatingResponse:
      description: Rating
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponseRating'
    RatingSummaryResponse:
      description: Current user's rating summary
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponseRatingSummary'
    RatingsResponse:
      description: Paged user ratings
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponseRatings'
  schemas:
    ApiResponseRating:
      allOf:
      - $ref: ./components.yaml#/components/schemas/ApiResponse
      - type: object
        properties:
          data:
            $ref: '#/components/schemas/Rating'
            description: 业务数据
      description: ApiResponseRating字段
    ApiResponseRatingCategories:
      allOf:
      - $ref: ./components.yaml#/components/schemas/ApiResponse
      - type: object
        properties:
          data:
            type: array
            items:
              type: string
            description: 业务数据
      description: ApiResponseRatingCategories字段
    ApiResponseRatingSummary:
      allOf:
      - $ref: ./components.yaml#/components/schemas/ApiResponse
      - type: object
        properties:
          data:
            $ref: '#/components/schemas/RatingSummary'
            description: 业务数据
      description: ApiResponseRatingSummary字段
    ApiResponseRatings:
      allOf:
      - $ref: ./components.yaml#/components/schemas/ApiResponse
      - type: object
        properties:
          data:
            $ref: '#/components/schemas/PageOfRatings'
            description: 业务数据
      description: ApiResponseRatings字段
    PageOfRatings:
      allOf:
      - $ref: ./components.yaml#/components/schemas/Page
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Rating'
          description: 列表数据
      description: PageOfRatings字段
    Rating:
      type: object
      required:
      - id
      - topicId
      - fromUserId
      - toUserId
      - score
      - categories
      - createdAt
      properties:
        id:
          type: string
          format: uuid
          description: 唯一标识
        topicId:
          type: string
          format: uuid
          description: 主题 ID
        fromUserId:
          type: string
          format: uuid
          description: 评价用户 ID
        toUserId:
          type: string
          format: uuid
          description: 被评价用户 ID
        score:
          type: string
          enum:
          - good
          - neutral
          - bad
          description: 评分
        categories:
          type: array
          items:
            type: string
          description: 评价分类
        comment:
          type: string
          nullable: true
          description: 评价评论
        createdAt:
          type: string
          format: date-time
          description: 创建时间
      description: Rating字段
    RatingRequest:
      type: object
      required:
      - toUserId
      - score
      properties:
        toUserId:
          type: string
          format: uuid
          description: 被评价用户 ID
        score:
          type: string
          description: 评分
        categoryCodes:
          type: array
          items:
            type: string
          description: 评价分类编码
        comment:
          type: string
          maxLength: 500
          description: 评价评论
      description: RatingRequest字段
    RatingSummary:
      type: object
      required:
      - good_count
      - neutral_count
      - bad_count
      - total_count
      - risk_tags
      properties:
        good_count:
          type: integer
          description: 好评数量
        neutral_count:
          type: integer
          description: 中评数量
        bad_count:
          type: integer
          description: 差评数量
        total_count:
          type: integer
          description: 评价总数
        good_rate:
          type: number
          nullable: true
          description: 好评率
        bad_rate:
          type: number
          nullable: true
          description: 差评率
        risk_tags:
          type: array
          items:
            type: string
          description: 风险标签
      description: RatingSummary字段
paths:
  /me/rating-summary:
    get:
      tags:
      - Ratings
      operationId: getMyRatingSummary
      security:
      - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/RatingSummaryResponse'
  /topics/{topicId}/ratings:
    post:
      tags:
      - Ratings
      operationId: rateTopicParticipant
      security:
      - bearerAuth: []
      parameters:
      - $ref: ./components.yaml#/components/parameters/topicId
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RatingRequest'
        description: 请求参数
      responses:
        '200':
          $ref: '#/components/responses/RatingResponse'
  /rating-categories:
    get:
      tags:
      - Ratings
      operationId: listRatingCategories
      responses:
        '200':
          $ref: '#/components/responses/RatingCategoriesResponse'
  /users/{userId}/ratings:
    get:
      tags:
      - Ratings
      operationId: listUserRatings
      parameters:
      - $ref: '#/components/parameters/userId'
      - $ref: ./components.yaml#/components/parameters/cursor
      - $ref: ./components.yaml#/components/parameters/limit
      responses:
        '200':
          $ref: '#/components/responses/RatingsResponse'
