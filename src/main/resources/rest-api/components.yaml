components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    topicId:
      name: topicId
      in: path
      required: true
      schema:
        type: string
        format: uuid
        description: 主题 ID
      description: 主题 ID
    status:
      name: status
      in: query
      required: false
      schema:
        type: string
        description: 当前状态
      description: 当前状态
    cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        description: cursor字段
      description: cursor字段
    limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
        description: limit字段
      description: limit字段
  responses:
    ApiResponse:
      description: Unified API response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
    InvitationResponse:
      description: Invitation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponseInvitation'
  schemas:
    ApiResponse:
      type: object
      required:
      - code
      - message
      - data
      - requestId
      properties:
        code:
          type: integer
          format: int32
          description: 业务状态码
        message:
          type: string
          description: 响应消息
        data:
          nullable: true
          description: Response payload; use the operation-specific response schema
        requestId:
          type: string
          description: 请求链路 ID
      description: ApiResponse字段
    ApiResponseInvitation:
      allOf:
      - $ref: '#/components/schemas/ApiResponse'
      - type: object
        properties:
          data:
            $ref: '#/components/schemas/Invitation'
            description: 业务数据
      description: ApiResponseInvitation字段
    User:
      type: object
      required:
      - id
      - nickname
      - communityId
      - status
      - communityChangedAt
      properties:
        id:
          type: string
          format: uuid
          description: 唯一标识
        nickname:
          type: string
          description: 用户昵称
        communityId:
          type: string
          format: uuid
          description: 社区 ID
        gender:
          type: string
          nullable: true
          description: 性别
        birthDate:
          type: string
          format: date
          nullable: true
          description: 出生日期
        avatarUrl:
          type: string
          nullable: true
          description: 头像地址
        status:
          type: string
          description: 当前状态
        communityChangedAt:
          type: string
          format: date-time
          nullable: true
          description: communityChangedAt字段
      description: User字段
    Invitation:
      type: object
      required:
      - id
      - topicId
      - inviteeId
      - inviterId
      - status
      properties:
        id:
          type: string
          format: uuid
          description: 唯一标识
        topicId:
          type: string
          format: uuid
          description: 主题 ID
        inviteeId:
          type: string
          format: uuid
          description: 受邀用户 ID
        inviterId:
          type: string
          format: uuid
          description: 邀请人 ID
        status:
          type: string
          description: 当前状态
        roomId:
          type: string
          format: uuid
          nullable: true
          description: 聊天室 ID
      description: Invitation字段
    Page:
      type: object
      required:
      - items
      - nextCursor
      - hasMore
      properties:
        items:
          type: array
          items: {}
          description: 列表数据
        nextCursor:
          type: string
          nullable: true
          description: 下一页游标
        hasMore:
          type: boolean
          description: 是否还有更多数据
      description: Page字段
