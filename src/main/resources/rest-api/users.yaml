openapi: 3.0.3
info:
  title: Part Service API - Users
  version: 1.0.0
servers:
- url: /api/v1
tags:
- name: Users
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters: {}
  responses:
    EmptyResponse:
      description: Account and associated data deleted
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponseEmpty'
    CommunitiesResponse:
      description: Available communities
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponseCommunities'
    UserResponse:
      description: User profile
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponseUser'
  schemas:
    ApiResponseEmpty:
      allOf:
      - $ref: '#/components/schemas/ApiResponse'
      - type: object
        properties:
          data:
            type: object
            additionalProperties: false
    ApiResponse:
      type: object
      required:
      - code
      - message
      - data
      - requestId
      properties:
        code:
          type: integer
          format: int32
          description: 业务状态码
        message:
          type: string
          description: 响应消息
        data:
          nullable: true
          description: Response payload; use the operation-specific response schema
        requestId:
          type: string
          description: 请求链路 ID
      description: ApiResponse字段
    User:
      type: object
      required:
      - id
      - nickname
      - communityId
      - status
      - communityChangedAt
      properties:
        id:
          type: string
          format: uuid
          description: 唯一标识
        nickname:
          type: string
          description: 用户昵称
        communityId:
          type: string
          format: uuid
          description: 社区 ID
        gender:
          type: string
          nullable: true
          description: 性别
        birthDate:
          type: string
          format: date
          nullable: true
          description: 出生日期
        avatarUrl:
          type: string
          nullable: true
          description: 头像地址
        status:
          type: string
          description: 当前状态
        communityChangedAt:
          type: string
          format: date-time
          nullable: true
          description: communityChangedAt字段
      description: User字段
    ApiResponseCommunities:
      allOf:
      - $ref: '#/components/schemas/ApiResponse'
      - type: object
        properties:
          data:
            type: array
            items:
              $ref: '#/components/schemas/Community'
            description: 业务数据
      description: ApiResponseCommunities字段
    ApiResponseUser:
      allOf:
      - $ref: '#/components/schemas/ApiResponse'
      - type: object
        properties:
          data:
            $ref: '#/components/schemas/User'
            description: 业务数据
      description: ApiResponseUser字段
    CommunityRequest:
      type: object
      required:
      - communityId
      properties:
        communityId:
          type: string
          format: uuid
          description: 社区 ID
      description: CommunityRequest字段
    ProfileRequest:
      type: object
      properties:
        nickname:
          type: string
          description: 用户昵称
        gender:
          type: string
          description: 性别
        birthDate:
          type: string
          format: date
          description: 出生日期
        avatarUrl:
          type: string
          format: uri
          description: 头像地址
      description: ProfileRequest字段
    Community:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: 唯一标识
        name:
          type: string
          description: name字段
      description: Community字段
paths:
  /me:
    delete:
      tags:
      - Users
      operationId: deleteCurrentUser
      summary: 注销当前账号并保留历史消息
      description: 删除当前用户、身份、验证码及全部会话；同时删除其发布的主题、参与、推送收件和评价，以及其聊天室成员关系和已读记录。保留聊天室、全部历史消息和其他成员的已读位置，消息发送者 ID 与聊天室主题 ID 保留原值，其他成员仍可查询历史。不接受目标用户 ID。身份释放后可重新注册。
      security:
      - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/EmptyResponse'
        '401':
          description: Missing or invalid access token
    get:
      tags:
      - Users
      operationId: getCurrentUser
      security:
      - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/UserResponse'
    patch:
      tags:
      - Users
      operationId: updateCurrentUser
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileRequest'
        description: 请求参数
      responses:
        '200':
          $ref: '#/components/responses/UserResponse'
  /me/community:
    patch:
      tags:
      - Users
      operationId: changeCommunity
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommunityRequest'
        description: 请求参数
      responses:
        '200':
          $ref: '#/components/responses/UserResponse'
  /communities:
    get:
      tags:
      - Users
      operationId: listCommunities
      responses:
        '200':
          $ref: '#/components/responses/CommunitiesResponse'
