openapi: 3.0.3
info:
  title: Part Service API - Auth
  version: 1.0.0
servers:
- url: /api/v1
tags:
- name: Auth
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters: {}
  responses:
    EmptyResponse:
      description: Successful operation with an empty object
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponseEmpty'
    SendCodeResponse:
      description: Verification code delivery limits
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponseSendCode'
    TokenPairResponse:
      description: Authentication tokens and user profile
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponseTokenPair'
  schemas:
    ApiResponse:
      type: object
      required:
      - code
      - message
      - data
      - requestId
      properties:
        code:
          type: integer
          format: int32
          description: 业务状态码
        message:
          type: string
          description: 响应消息
        data:
          nullable: true
          description: Response payload; use the operation-specific response schema
        requestId:
          type: string
          description: 请求链路 ID
      description: ApiResponse字段
    User:
      type: object
      required:
      - id
      - nickname
      - communityId
      - status
      - communityChangedAt
      properties:
        id:
          type: string
          format: uuid
          description: 唯一标识
        nickname:
          type: string
          description: 用户昵称
        communityId:
          type: string
          format: uuid
          description: 社区 ID
        gender:
          type: string
          nullable: true
          description: 性别
        birthDate:
          type: string
          format: date
          nullable: true
          description: 出生日期
        avatarUrl:
          type: string
          nullable: true
          description: 头像地址
        status:
          type: string
          description: 当前状态
        communityChangedAt:
          type: string
          format: date-time
          nullable: true
          description: communityChangedAt字段
      description: User字段
    ApiResponseEmpty:
      allOf:
      - $ref: '#/components/schemas/ApiResponse'
      - type: object
        properties:
          data:
            type: object
            additionalProperties: false
            description: 业务数据
      description: ApiResponseEmpty字段
    ApiResponseSendCode:
      allOf:
      - $ref: '#/components/schemas/ApiResponse'
      - type: object
        properties:
          data:
            $ref: '#/components/schemas/SendCodeResult'
            description: 业务数据
      description: ApiResponseSendCode字段
    ApiResponseTokenPair:
      allOf:
      - $ref: '#/components/schemas/ApiResponse'
      - type: object
        properties:
          data:
            $ref: '#/components/schemas/TokenPair'
            description: 业务数据
      description: ApiResponseTokenPair字段
    LoginRequest:
      type: object
      required:
      - identityType
      - identityValue
      anyOf:
      - required: [code]
      - required: [password]
      description: code 与 password 必须且只能提供一个；identityType 支持 email 或 phone
      properties:
        identityType:
          type: string
          enum: [email, phone]
          description: 身份类型（email 或 phone）
        identityValue:
          type: string
          description: 身份值
        code:
          type: string
          description: 登录验证码；使用验证码登录时必填
        password:
          type: string
          minLength: 8
          maxLength: 72
          description: 登录密码；使用密码登录时必填
        deviceId:
          type: string
          description: 设备标识
      description: LoginRequest字段
    RefreshRequest:
      type: object
      required:
      - refreshToken
      properties:
        refreshToken:
          type: string
          description: 刷新令牌
      description: RefreshRequest字段
    ChangePasswordRequest:
      type: object
      required:
      - currentPassword
      - newPassword
      properties:
        currentPassword:
          type: string
          minLength: 8
          maxLength: 72
          description: 当前密码
        newPassword:
          type: string
          minLength: 8
          maxLength: 72
          description: 新密码（8 至 72 个字符）
      additionalProperties: false
      description: 不包含用户 ID；目标用户由 access token 唯一确定
    RegisterRequest:
      type: object
      required:
      - identityType
      - identityValue
      - password
      - nickname
      - communityId
      properties:
        identityType:
          type: string
          description: 身份类型（email 或 phone）
        identityValue:
          type: string
          description: 身份值
        code:
          type: string
          description: 注册验证码；全局配置 register_verify_code 为 true 时必填，为 false 时可省略
        password:
          type: string
          minLength: 8
          maxLength: 72
          description: 登录密码（8 至 72 个字符）
        nickname:
          type: string
          maxLength: 32
          description: 用户昵称
        communityId:
          type: string
          format: uuid
          description: 社区 ID
      description: RegisterRequest字段
    SendCodeRequest:
      type: object
      required:
      - identityType
      - identityValue
      - purpose
      properties:
        identityType:
          type: string
          description: 身份类型（email 或 phone）
        identityValue:
          type: string
          description: 身份值
        purpose:
          type: string
          description: 验证码用途
      description: SendCodeRequest字段
    SendCodeResult:
      type: object
      required:
      - expires_in
      - next_send_after
      properties:
        expires_in:
          type: integer
          description: Verification code lifetime in seconds
        next_send_after:
          type: integer
          description: Minimum seconds before another code can be requested
      description: SendCodeResult字段
    TokenPair:
      type: object
      required:
      - accessToken
      - expiresIn
      - refreshToken
      - user
      properties:
        accessToken:
          type: string
          description: 访问令牌
        expiresIn:
          type: integer
          format: int64
          description: 访问令牌有效期（秒）
        refreshToken:
          type: string
          description: 刷新令牌
        user:
          $ref: '#/components/schemas/User'
          description: user字段
      description: TokenPair字段
paths:
  /auth/send-code:
    post:
      tags:
      - Auth
      operationId: sendCode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendCodeRequest'
        description: 请求参数
      responses:
        '200':
          $ref: '#/components/responses/SendCodeResponse'
  /auth/register:
    post:
      tags:
      - Auth
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        description: 请求参数
      responses:
        '200':
          $ref: '#/components/responses/TokenPairResponse'
  /auth/login:
    post:
      tags:
      - Auth
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        description: 请求参数
      responses:
        '200':
          $ref: '#/components/responses/TokenPairResponse'
  /auth/refresh:
    post:
      tags:
      - Auth
      operationId: refresh
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
        description: 请求参数
      responses:
        '200':
          $ref: '#/components/responses/TokenPairResponse'
  /auth/logout:
    post:
      tags:
      - Auth
      operationId: logout
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
        description: 请求参数
      responses:
        '200':
          $ref: '#/components/responses/EmptyResponse'
  /auth/password:
    put:
      tags:
      - Auth
      operationId: changePassword
      summary: 修改当前登录用户的密码
      description: 用户身份仅从 bearer access token 确定。请求中不接受 userId，服务端必须校验 currentPassword 属于令牌对应用户。
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
        description: 请求参数
      responses:
        '200':
          $ref: '#/components/responses/EmptyResponse'
